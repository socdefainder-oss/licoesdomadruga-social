name: Publicar no Instagram

# Roda de hora em hora das 07h as 21h (Brasilia = UTC-3) e publica o que venceu na agenda.json
on:
  schedule:
    - cron: "2 0,10-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publicar o que venceu
        run: python publicar.py publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      - name: Registrar publicados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicados.json
          git diff --cached --quiet || (git commit -m "Registra publicacoes" && git push)
